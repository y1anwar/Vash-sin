<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интересный сайт</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: sans-serif; background-color: #111;
        }
        /* Экран-заставка на весь экран */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #111; display: flex; justify-content: center;
            align-items: center; z-index: 9999; transition: opacity 0.5s ease;
        }
        /* Большая кнопка входа */
        .start-btn {
            padding: 20px 50px; font-size: 24px; font-weight: bold;
            color: #111; background-color: #00ff7f; border: none;
            border-radius: 50px; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 127, 0.6);
        }
        /* Основной контент, который покажется после клика */
        #content {
            display: flex; justify-content: center; align-items: center;
            height: 100%; color: white; font-size: 20px; text-align: center;
        }
    </style>
</head>
<body>

    <!-- Заставка с кнопкой -->
    <div id="overlay">
        <button class="start-btn" id="entryBtn">ВОЙТИ НА САЙТ</button>
    </div>

    <!-- Основное содержимое сайта (появится после клика) -->
    <div id="content">
        <div>
            <h1>Добро пожаловать!</h1>
            <p>Вы успешно вошли на страницу.</p>
        </div>
    </div>

    <script>
        const overlay = document.getElementById('overlay');
        const entryBtn = document.getElementById('entryBtn');
        const audio = document.getElementById('memeAudio');

        entryBtn.addEventListener('click', () => {
            // 1. Мгновенно включаем звук мема
            audio.play().catch(err => console.log("Ошибка звука:", err));

            // 2. Прячем заставку
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 500); // убираем экран полностью через полсекунды анимации
        });
    </script>

</body>
